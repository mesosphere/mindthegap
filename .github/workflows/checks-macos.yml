name: build-on-macos
on:
  push:
    branches:
      - main
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    branches:
      - main
defaults:
  run:
    shell: bash
jobs:
  build-and-run:
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Install devbox
        uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          enable-cache: true
        env:
          NIX_USER_COUNT: 4
      - name: Build
        run: |
          GORELEASER_PLATFORMS='"darwin_amd64"' devbox run -- task build:release-unpublished
        env:
          TMPDIR: ${{ runner.temp }}
      - name: Run binary
        run: |
          ./dist/mindthegap_darwin_amd64_v1/mindthegap
